<!DOCTYPE html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#111214" />
    <title>Thank you | MBA Cleaning Services</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; color: #fff; background: radial-gradient(circle at 15% 15%, rgba(200,16,24,.25), transparent 30%), #111214; font-family: Arial, sans-serif; }
      main { width: min(620px, 100%); overflow: hidden; text-align: center; background: #fff; border-radius: 28px; box-shadow: 0 32px 100px rgba(0,0,0,.45); }
      .top { padding: 38px 34px 28px; color: #17191d; background: #f7f6f3; border-bottom: 1px solid #e4e5e7; }
      img { width: 130px; height: 130px; object-fit: contain; margin: 0 auto 22px; background: #fff; border-radius: 18px; }
      .check { width: 42px; height: 42px; display: grid; place-items: center; margin: 0 auto 15px; color: #fff; background: #c81018; border-radius: 50%; font-size: 1.25rem; font-weight: 700; }
      h1 { margin: 0 0 10px; color: #111214; font-size: clamp(2rem, 7vw, 3.4rem); letter-spacing: -.045em; }
      p { max-width: 480px; margin: 0 auto; color: #62666e; line-height: 1.65; }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 26px 24px 30px; }
      a { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; padding: 12px 21px; color: #fff; background: #c81018; border-radius: 999px; font-weight: 700; text-decoration: none; }
      a.secondary { color: #111214; background: #efefef; }
      small { display: block; padding: 0 24px 28px; color: #7c7f85; }
      @media (max-width: 480px) { .actions { flex-direction: column; } .actions a { width: 100%; } }
    </style>
  </head>
  <body>
    <main>
      <div class="top">
        <img src="/logo.jpg" alt="MBA Cleaning Services" />
        <div class="check" aria-hidden="true">✓</div>
        <h1>Enquiry received.</h1>
        <p>Thank you for contacting MBA Cleaning Services. We will review the details and respond as soon as possible.</p>
      </div>
      <div class="actions">
        <a href="tel:+61415081517">Call 0415 081 517</a>
        <a class="secondary" href="/">Return to the website</a>
      </div>
      <small>Cleaning and vegetation services across metropolitan Melbourne.</small>
    </main>
  </body>
</html>
